<html lang="en" data-theme="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* ===== 5 THEMES ===== */
:root,[data-theme=violet]{--bg1:#14102b;--bg2:#2a1245;--ink:#f4f1ff;--muted:#b9b2d6;--glass:rgba(255,255,255,.08);--edge:rgba(255,255,255,.18);--field:rgba(255,255,255,.1);--accent:#ff7a59;--accent2:#ff4f81;--focus:#7c5cff;--orb1:#7c5cff;--orb2:#ff7a59;--orbop:.5;--ok:#3ddc97;--btn:#fff;--shadow:rgba(10,5,40,.3)}
[data-theme=ocean]{--bg1:#06182b;--bg2:#0b3a5b;--ink:#eef7ff;--muted:#9fbad0;--glass:rgba(255,255,255,.08);--edge:rgba(255,255,255,.2);--field:rgba(255,255,255,.1);--accent:#22d3c5;--accent2:#3b82f6;--focus:#3b82f6;--orb1:#3b82f6;--orb2:#22d3c5;--orbop:.5;--ok:#5eead4;--btn:#04222b;--shadow:rgba(0,10,30,.35)}
[data-theme=emerald]{--bg1:#07130e;--bg2:#11291d;--ink:#f3f7f1;--muted:#a6bdb0;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.16);--field:rgba(255,255,255,.09);--accent:#d4a73a;--accent2:#f0cf6e;--focus:#d4a73a;--orb1:#1f9d6b;--orb2:#d4a73a;--orbop:.5;--ok:#4ade80;--btn:#1d1604;--shadow:rgba(0,0,0,.4)}
[data-theme=ivory]{--bg1:#f7f2e8;--bg2:#e8dcc3;--ink:#231b10;--muted:#6a5d49;--glass:rgba(255,255,255,.6);--edge:rgba(255,255,255,.95);--field:rgba(255,255,255,.7);--accent:#b8801f;--accent2:#8a5a14;--focus:#8a5a14;--orb1:#e0b45a;--orb2:#c98b6b;--orbop:.5;--ok:#1f8f5f;--btn:#fff;--shadow:rgba(90,60,10,.18)}
[data-theme=white]{--bg1:#ffffff;--bg2:#f3f5fa;--ink:#111827;--muted:#5b6475;--glass:rgba(255,255,255,.9);--edge:rgba(17,24,39,.09);--field:rgba(17,24,39,.04);--accent:#2563eb;--accent2:#4f46e5;--focus:#2563eb;--orb1:#c7d2fe;--orb2:#bae6fd;--orbop:.55;--ok:#059669;--btn:#fff;--shadow:rgba(17,24,39,.1)}
:root{--logo:44px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;overflow-x:hidden;line-height:1.6;transition:background .5s,color .4s}
h1,h2,h3{font-family:'Sora',system-ui,sans-serif;line-height:1.2}
img{max-width:100%}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:var(--orbop);z-index:-1;animation:drift 18s ease-in-out infinite alternate;transition:background .5s;pointer-events:none}
.o1{width:420px;height:420px;background:var(--orb1);top:-100px;left:-120px}
.o2{width:380px;height:380px;background:var(--orb2);bottom:-120px;right:-100px;animation-delay:-6s}
@keyframes drift{to{transform:translate(60px,80px) scale(1.15)}}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-radius:24px;box-shadow:0 20px 50px var(--shadow)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.brandrow{display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:22px 0 0}
.brandrow img{height:var(--logo);width:auto;max-width:60vw;object-fit:contain}
.brandrow b{font:800 var(--bsize,22px) 'Sora',system-ui,sans-serif;line-height:1.2}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:0;cursor:pointer;font:600 1rem 'Sora',system-ui,sans-serif;color:var(--btn);background:linear-gradient(120deg,var(--accent),var(--accent2));padding:12px 30px;border-radius:999px;text-decoration:none;box-shadow:0 10px 30px var(--shadow);transition:transform .25s,filter .25s;-webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-3px);filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sm{min-height:40px;padding:8px 20px;font-size:.9rem}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding:36px 0 70px}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--ok);color:var(--ok);font-weight:500;margin-bottom:18px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;margin-bottom:16px}
.hero p{color:var(--muted);font-size:1.1rem;max-width:480px;margin-bottom:24px}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.price .now{font:800 2.4rem 'Sora',sans-serif}
.price s{color:var(--muted);font-size:1.2rem}
.price .off{background:var(--accent);color:var(--btn);padding:3px 12px;border-radius:999px;font-weight:600;font-size:.9rem}
.timer{display:flex;gap:10px;margin-bottom:26px}
.timer div{padding:10px 14px;text-align:center;min-width:64px;border-radius:16px}
.timer b{display:block;font:800 1.4rem 'Sora',sans-serif}
.timer small{color:var(--muted)}
.shot{padding:22px;animation:float 6s ease-in-out infinite;position:relative}
.shot img{width:100%;display:block;border-radius:18px;aspect-ratio:1/1;object-fit:cover}
@keyframes float{50%{transform:translateY(-14px)}}
.shot .tag{position:absolute;z-index:3;top:34px;right:34px;padding:8px 16px;border-radius:999px;font-weight:600}
.stage{position:relative}
.stage .arr{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;min-height:0;padding:0;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--ink);cursor:pointer;font-size:1.5rem;line-height:1;display:grid;place-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:2;box-shadow:0 6px 16px var(--shadow)}
.arr.prev{left:10px}.arr.next{right:10px}
.thumbs{display:flex;gap:10px;margin-top:14px;justify-content:center}
.thumbs button{flex:0 1 74px;aspect-ratio:1/1;padding:0;border-radius:12px;border:2px solid transparent;overflow:hidden;cursor:pointer;background:var(--field);opacity:.65;transition:opacity .2s,border-color .2s}
.thumbs button.on{border-color:var(--accent);opacity:1}
.thumbs img{width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:cover;display:block}
section{padding:50px 0}
h2{font-size:clamp(1.6rem,4.5vw,2.4rem);margin-bottom:26px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:20px}
.card{padding:26px;transition:transform .3s}
.card:hover{transform:translateY(-6px)}
.card h3{margin-bottom:8px;font-size:1.1rem}
.card p{color:var(--muted)}
.ico{font-size:1.8rem;margin-bottom:10px}
.stars{color:#f5b301;letter-spacing:2px;margin-bottom:8px}
.who{margin-top:12px;font-weight:500}
.order{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}
.order form,.summary{padding:30px}
label{display:block;font-weight:500;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--edge);background:var(--field);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border .2s,box-shadow .2s}
select option{color:#222}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 35%,transparent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.summary li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--edge)}
.summary .total{font:800 1.3rem 'Sora',sans-serif;border:0;padding-top:16px}
.note{color:var(--muted);font-size:.9rem;margin-top:14px}
#msg{margin-top:14px;font-weight:500}
.done{text-align:center;padding:40px 20px;display:none}
.done .tick{width:80px;height:80px;border-radius:50%;background:var(--ok);color:#fff;font-size:2.6rem;display:grid;place-items:center;margin:0 auto 18px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
footer{text-align:center;color:var(--muted);padding:30px 20px 50px}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
.bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:12px;border-radius:20px 20px 0 0;transition:transform .3s}
.bar.off{transform:translateY(110%)}
.bar small{color:var(--muted);display:block;line-height:1.2}
.bar b{font:800 1.2rem 'Sora',sans-serif}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
/* ===== ADMIN PANEL (visible only with ?admin) ===== */
#fab{position:fixed;right:18px;bottom:18px;z-index:50;display:none}
#panel{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);z-index:60;background:var(--bg1);border-left:1px solid var(--edge);box-shadow:-20px 0 50px var(--shadow);overflow-y:auto;padding:18px 18px 60px;transform:translateX(105%);transition:transform .35s;font-size:.92rem}
#panel.open{transform:none}
#panel h4{font:700 1rem 'Sora',sans-serif;margin:22px 0 6px;padding-top:14px;border-top:1px solid var(--edge)}
#panel label{margin:10px 0 4px;font-size:.85rem;color:var(--muted)}
#panel input,#panel textarea,#panel select{padding:9px 12px;border-radius:10px}
#panel input[type=checkbox]{width:auto;margin-right:8px}
#panel input[type=color]{padding:2px;height:40px}
#panel input[type=range]{padding:0}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.sw button{height:54px;border-radius:12px;border:2px solid transparent;cursor:pointer;color:#fff;font:600 .72rem 'Sora',sans-serif;text-shadow:0 1px 3px #000}
.sw button.light{color:#222;text-shadow:none;border-color:rgba(0,0,0,.12)}
.sw button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.item{border:1px solid var(--edge);border-radius:14px;padding:10px;margin-top:10px}
.mini{border:1px solid var(--edge);background:var(--field);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;font:inherit;margin-top:8px;min-height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--field);border:1px solid var(--edge);border-radius:12px;padding:10px;font-size:.78rem;max-height:240px;overflow:auto;margin-top:6px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:500}
/* ===== MOBILE ===== */
@media(max-width:820px){
  .hero,.order{grid-template-columns:1fr}
  .hero{padding:16px 0 36px;gap:24px}
  .shot{order:-1;animation:none;padding:14px}
  .shot .tag{top:24px;right:24px}
  section{padding:32px 0}
  .summary{order:-1}
  .bar{display:flex}
  body{padding-bottom:84px}
  .orb{width:260px;height:260px;filter:blur(60px)}
  #fab{bottom:96px}
}
@media(max-width:520px){
  .wrap{padding:0 16px}
  .row,.two{grid-template-columns:1fr}
  .row{gap:0}
  .two{gap:0}
  .hero .btn{width:100%}
  .timer{gap:8px}.timer div{flex:1;min-width:0;padding:8px}
  .price .now{font-size:2rem}
  .order form,.summary{padding:20px}
  .card{padding:20px}
  .glass{border-radius:20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>

<main class="wrap">
  <div class="brandrow" id="brandRow"><img id="logo" alt="Logo"><b id="brand"></b></div>

  <div class="hero">
    <div>
      <span class="badge" id="stock"></span>
      <h1 id="title"></h1>
      <p id="tagline"></p>
      <div class="price"><span class="now" id="now"></span><s id="old"></s><span class="off" id="off"></span></div>
      <div class="timer" id="timer">
        <div class="glass"><b id="h">00</b><small id="tH"></small></div>
        <div class="glass"><b id="m">00</b><small id="tM"></small></div>
        <div class="glass"><b id="s">00</b><small id="tS"></small></div>
      </div>
      <a href="#order" class="btn" id="cta"></a>
    </div>
    <div class="glass shot"><span class="tag glass" id="tag"></span>
      <div class="stage" id="stage"><img id="img" alt="Product image"><button class="arr prev" id="prev" type="button" aria-label="Previous image">‹</button><button class="arr next" id="next" type="button" aria-label="Next image">›</button></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </div>

  <section class="reveal" id="secF"><h2 id="h2F"></h2><div class="grid" id="features"></div></section>
  <section class="reveal" id="secR"><h2 id="h2R"></h2><div class="grid" id="reviews"></div></section>

  <section id="order" class="reveal">
    <h2 id="h2O"></h2>
    <div class="order">
      <form id="form" class="glass" novalidate>
        <label for="name" id="lName"></label><input id="name" name="name" autocomplete="name" required>
        <div class="row">
          <div><label for="phone" id="lPhone"></label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="03xx xxxxxxx" required></div>
          <div><label for="qty" id="lQty"></label><select id="qty" name="qty"></select></div>
        </div>
        <label for="city" id="lCity"></label><input id="city" name="city" autocomplete="address-level2" required>
        <label for="address" id="lAddr"></label><textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea>
        <label for="pay" id="lPay"></label><select id="pay" name="pay"></select>
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        <p style="margin-top:20px"><button class="btn" id="submit" type="submit" style="width:100%"></button></p>
        <p id="msg" role="status"></p>
      </form>
      <aside class="glass summary">
        <h3 style="margin-bottom:10px" id="lSum"></h3>
        <ul>
          <li><span id="lPrice"></span><span id="sPrice"></span></li>
          <li><span id="lQtyS"></span><span id="sQty">1</span></li>
          <li><span id="lShip"></span><span id="sShip"></span></li>
          <li class="total"><span id="lTot"></span><span id="sTotal"></span></li>
        </ul>
        <p class="note" id="sNote"></p>
      </aside>
      <div class="glass done" id="done" style="grid-column:1/-1"><div class="tick">✓</div><h3 id="doneTitle"></h3><p class="note" id="doneTxt"></p></div>
    </div>
  </section>
</main>
<footer>© <span id="yr"></span> <span id="brand2"></span>. All rights reserved.</footer>

<div class="bar glass" id="bar"><div><small id="barLbl">Total</small><b id="barPrice"></b></div><a href="#order" class="btn sm" id="barCta"></a></div>
<button class="btn sm" id="fab">⚙ Edit page</button>
<aside id="panel" aria-label="Control panel"></aside>

<script>
/* ===== DEFAULT SETTINGS (everything can be changed from the admin panel) ===== */
const DEFAULTS = {
  theme:"violet", accent:"", accent2:"",
  brand:"Your Brand", showBrand:true, logo:"", logoSize:44, brandSize:22,

  msgFail:"We couldn't save your order online, but it was sent to WhatsApp. If WhatsApp didn't open, please try again.",

};
const THEMES={violet:["Midnight Violet","#14102b,#ff4f81"],ocean:["Ocean Blue","#06182b,#22d3c5"],emerald:["Emerald Gold","#07130e,#d4a73a"],ivory:["Ivory Gold","#e8dcc3,#b8801f"],white:["Pure White","#ffffff,#2563eb"]};
const LIGHT=["ivory","white"];
const LBL=["lName","lPhone","lQty","lCity","lAddr","lPay","lSum","lPrice","lQtyS","lShip","lTot","sNote","tH","tM","tS","doneTitle"];
const SHEET_SCRIPT=`function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sh = ss.getSheetByName("Orders") || ss.insertSheet("Orders");
    if (sh.getLastRow() === 0) {
      sh.appendRow(["Order ID","Date","Product","Quantity","Unit price","Delivery","Total","Payment","Name","Phone","City","Address","Status"]);
    }
    var p = e.parameter, row = sh.getLastRow() + 1;
    sh.getRange(row, 1, 1, 13).setNumberFormat("@");
    sh.getRange(row, 1, 1, 13).setValues([[p.orderId, p.date, p.product, p.qty, p.price, p.shipping, p.total, p.payment, p.name, p.phone, p.city, p.address, "New"]]);
  } finally {
    lock.releaseLock();
  }
  return ContentService.createTextOutput("ok");
}`;

const norm=raw=>{const c={...DEFAULTS,...raw};let im=Array.isArray(raw.images)?raw.images.slice(0,4):(raw.image?[raw.image]:[]);while(im.length<4)im.push("");c.images=im;delete c.image;return c};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fill=(t,o)=>String(t).replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
const ADMIN=new URLSearchParams(location.search).has("admin");
let C=JSON.parse(JSON.stringify(DEFAULTS));
const rs=n=>C.currency+" "+Number(n).toLocaleString("en-PK");
const ph="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#7c5cff'/><stop offset='1' stop-color='#ff7a59'/></linearGradient></defs><rect width='400' height='400' fill='url(#g)'/><text x='200' y='215' font-size='26' text-anchor='middle' fill='white' font-family='sans-serif'>Your product image here</text></svg>`);

/* ===== RENDER ===== */
let end,endHrs;
function setSrc(el,v){if(el.getAttribute("src")!==v)el.src=v}
function render(){
  const r=document.documentElement;
  r.dataset.theme=C.theme;
  ["accent","accent2"].forEach(k=>C[k]?r.style.setProperty("--"+k,C[k]):r.style.removeProperty("--"+k));
  C.accent?r.style.setProperty("--focus",C.accent2||C.accent):r.style.removeProperty("--focus");
  r.style.setProperty("--logo",(C.logoSize||44)+"px");r.style.setProperty("--bsize",(C.brandSize||22)+"px");
  const name=(C.brand||"").trim();
  document.title=(name?name+" – ":"")+C.title;
  $("fav").href=C.logo||"data:,";
  $("logo").classList.toggle("hide",!C.logo); if(C.logo)setSrc($("logo"),C.logo);
  $("brand").textContent=name; $("brand").classList.toggle("hide",!name||(!!C.logo&&!C.showBrand));
  $("brandRow").classList.toggle("hide",!C.logo&&!name);
  $("brand2").textContent=name||C.title;
  $("title").textContent=C.title; $("tagline").textContent=C.tagline;
  $("stock").textContent=C.stock; $("tag").textContent=C.tag;
  $("cta").textContent=C.cta; $("barCta").textContent=C.barCta; $("submit").textContent=C.submitText;
  $("h2F").textContent=C.h2F; $("h2R").textContent=C.h2R; $("h2O").textContent=C.h2O;
  gallery();
  $("now").textContent=$("barPrice").textContent=rs(C.price); $("old").textContent=rs(C.oldPrice);
  const pct=C.oldPrice>C.price?Math.round((1-C.price/C.oldPrice)*100):0;
  $("off").textContent=pct+"% OFF"; $("off").classList.toggle("hide",!pct); $("old").classList.toggle("hide",!pct);
  $("tag").classList.toggle("hide",!C.tag); $("stock").classList.toggle("hide",!C.stock);
  $("timer").classList.toggle("hide",!C.showTimer);
  $("secF").classList.toggle("hide",!C.showFeatures); $("secR").classList.toggle("hide",!C.showReviews);
  $("features").innerHTML=C.features.map(f=>`<div class="glass card"><div class="ico">${esc(f[0])}</div><h3>${esc(f[1])}</h3><p>${esc(f[2])}</p></div>`).join("");
  $("reviews").innerHTML=C.reviews.map(v=>`<div class="glass card"><div class="stars">${"★".repeat(v[2])}${"☆".repeat(5-v[2])}</div><p>“${esc(v[1])}”</p><div class="who">${esc(v[0])}</div></div>`).join("");
  const q=$("qty"),qv=q.value||1; q.innerHTML=Array.from({length:Math.max(1,C.maxQty|0)},(_,i)=>`<option>${i+1}</option>`).join(""); q.value=qv>q.options.length?1:qv;
  const p=$("pay"),pv=p.value; p.innerHTML=C.payments.split(",").map(s=>s.trim()).filter(Boolean).map(s=>`<option>${esc(s)}</option>`).join(""); if(pv)p.value=pv;
  if(endHrs!==C.offerHours){endHrs=C.offerHours;const k="offerEnd"+endHrs;try{end=+localStorage.getItem(k)}catch(e){}if(!end||end<Date.now()){end=Date.now()+endHrs*3600e3;try{localStorage.setItem(k,end)}catch(e){}}}
  LBL.forEach(k=>$(k).textContent=C[k]);
  summary();
}
let gi=0;
function pics(){const a=C.images.filter(Boolean);return a.length?a:[ph]}
function gallery(){
  const a=pics();if(gi>=a.length)gi=0;
  const im=$("img");setSrc(im,a[gi]);im.onerror=()=>{im.onerror=null;im.src=ph};
  const multi=a.length>1;
  $("prev").classList.toggle("hide",!multi);$("next").classList.toggle("hide",!multi);$("thumbs").classList.toggle("hide",!multi);
  $("thumbs").innerHTML=multi?a.map((x,i)=>`<button type="button" data-i="${i}" class="${i===gi?"on":""}" aria-label="Show image ${i+1}"><img src="${esc(x)}" alt=""></button>`).join(""):"";
}
function go(d){const n=pics().length;gi=(gi+d+n)%n;gallery()}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("thumbs").onclick=e=>{const b=e.target.closest("button");if(b){gi=+b.dataset.i;gallery()}};
let tx=null;
$("stage").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("stage").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40)go(dx<0?1:-1)});
function total(){return C.price*+$("qty").value+ +C.shipping}
function summary(){$("sPrice").textContent=rs(C.price);$("sQty").textContent=$("qty").value;$("sShip").textContent=+C.shipping?rs(C.shipping):C.lFree;$("sTotal").textContent=rs(total())}
$("qty").addEventListener("change",summary);
setInterval(()=>{const t=Math.max(0,Math.floor((end-Date.now())/1000));$("h").textContent=String(Math.floor(t/3600)).padStart(2,"0");$("m").textContent=String(Math.floor(t%3600/60)).padStart(2,"0");$("s").textContent=String(t%60).padStart(2,"0")},1000);
$("yr").textContent=new Date().getFullYear();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
// hide the mobile bottom bar while the order form is on screen
new IntersectionObserver(es=>es.forEach(e=>$("bar").classList.toggle("off",e.isIntersecting)),{threshold:.05}).observe($("order"));

/* ===== ORDER SUBMIT ===== */
$("form").addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,msg=$("msg"),v=n=>f.elements[n].value.trim();
  if(!v("name")||!/^[0-9+\s-]{10,15}$/.test(v("phone"))||!v("city")||!v("address")){msg.style.color="#e5484d";msg.textContent=C.msgFill;return}
  const n=new Date(),z=x=>String(x).padStart(2,"0");
  const d={orderId:"ORD-"+String(n.getFullYear()).slice(2)+z(n.getMonth()+1)+z(n.getDate())+"-"+Math.floor(1000+Math.random()*9000),
    date:n.toLocaleString("en-PK",{dateStyle:"medium",timeStyle:"short"}),product:C.title,qty:f.qty.value,price:rs(C.price),
    shipping:+C.shipping?rs(C.shipping):C.lFree,total:rs(total()),payment:f.pay.value,name:v("name"),phone:v("phone"),city:v("city"),address:v("address")};
  if(C.whatsapp)window.open(`https://wa.me/${C.whatsapp}?text=${encodeURIComponent(fill(C.waTemplate,d))}`,"_blank");
  const btn=$("submit");btn.disabled=true;msg.style.color="";msg.textContent=C.msgSending;
  const jobs=[];
  if(C.sheetUrl)jobs.push(fetch(C.sheetUrl,{method:"POST",mode:"no-cors",body:new URLSearchParams(d)}));
  if(C.email)jobs.push(fetch("https://formsubmit.co/ajax/"+C.email,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify({"Order ID":d.orderId,Date:d.date,Product:d.product,Quantity:d.qty,"Unit price":d.price,Delivery:d.shipping,Total:d.total,Payment:d.payment,Name:d.name,Phone:d.phone,City:d.city,Address:d.address,_subject:"New Order "+d.orderId+": "+C.title+" – "+d.name,_template:"table",_honey:f._honey.value})
  }).then(r=>{if(!r.ok)throw 0}));
  const res=await Promise.allSettled(jobs);
  if(jobs.length&&res.every(x=>x.status==="rejected")){btn.disabled=false;msg.style.color="#e5484d";msg.textContent=C.msgFail;return}
  if(window.fbq)fbq("track","Purchase",{value:total(),currency:"PKR"});
  f.style.display="none";document.querySelector(".summary").style.display="none";$("done").style.display="block";
  $("doneTxt").textContent=fill(C.doneMsg,d);
  $("done").scrollIntoView({behavior:"smooth",block:"center"});
});

/* ===== ADMIN PANEL ===== */
function setupAdmin(){
  const P=$("panel"),fab=$("fab");fab.style.display="block";
  let GH={owner:"",repo:"",branch:"main",token:""};try{GH={...GH,...JSON.parse(localStorage.getItem("gh")||"{}")}}catch(e){}
  fab.onclick=()=>P.classList.toggle("open");
  const save=()=>{try{localStorage.setItem("draftCfg",JSON.stringify(C))}catch(e){}};
  const fld=(k,l,t="text")=>`<label>${l}<input data-k="${k}" type="${t}" value="${esc(C[k])}"></label>`;
  const ta=(k,l,r=3)=>`<label>${l}<textarea data-k="${k}" rows="${r}">${esc(C[k])}</textarea></label>`;
  const chk=(k,l)=>`<label><input type="checkbox" data-k="${k}" ${C[k]?"checked":""}>${l}</label>`;
  const col=k=>C[k]||getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim()||"#000000";
  function build(){
    P.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3>Control Panel</h3><button class="mini" data-a="close">Close</button></div>
    <p class="note">Changes are visible only to you until you click "Save to GitHub" at the bottom.</p>
    <h4>Colour theme</h4>
    <div class="sw">${Object.entries(THEMES).map(([k,[n,c]])=>{const[a,b]=c.split(",");return`<button data-a="theme" data-v="${k}" class="${LIGHT.includes(k)?"light ":""}${C.theme===k?"on":""}" style="background:linear-gradient(135deg,${a},${b})">${n}</button>`}).join("")}</div>
    <div class="two"><label>Accent 1<input type="color" data-k="accent" value="${col("accent")}"></label><label>Accent 2<input type="color" data-k="accent2" value="${col("accent2")}"></label></div>
    <button class="mini" data-a="resetcolors">Use theme colours</button>
    <h4>Website name &amp; logo</h4>
    ${fld("brand","Website name")}${chk("showBrand","Show the name next to the logo")}
    <label>Name size: ${C.brandSize}px<input type="range" min="12" max="64" data-k="brandSize" value="${C.brandSize}"></label>
    ${fld("logo","Logo link or file name (e.g. logo.png)")}
    <label>Or upload a logo<input type="file" accept="image/*" data-a="logoup"></label>
    <label>Logo height: ${C.logoSize}px<input type="range" min="24" max="140" data-k="logoSize" value="${C.logoSize}"></label>
    <button class="mini" data-a="rmlogo">Remove logo</button>
    <h4>Text</h4>
    ${fld("title","Product name")}${ta("tagline","Tagline")}
    ${fld("stock","Stock badge (empty = hidden)")}${fld("tag","Image tag (empty = hidden)")}
    ${fld("cta","Main button text")}${fld("barCta","Mobile bottom bar button")}${fld("submitText","Order button text")}
    <h4>Product images (up to 4)</h4>
    <p class="note">Visitors switch images with the arrows, by swiping, or by tapping a thumbnail. Empty slots are skipped.</p>
    ${C.images.map((x,i)=>`<div class="item"><b>Image ${i+1}</b>${x?`<div><img src="${esc(x)}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px;margin-top:6px"></div>`:""}${x&&x.startsWith("data:")?`<div class="note">Uploaded image</div>`:`<input data-im="${i}" value="${esc(x)}" placeholder="Link or file name, e.g. product-${i+1}.jpg" style="margin-top:6px">`}<label>Upload from device<input type="file" accept="image/*" data-a="upim" data-i="${i}"></label>${x?`<button class="mini" data-a="rmim" data-i="${i}">Remove</button>`:""}</div>`).join("")}
    <h4>Price &amp; offer</h4>
    <div class="two">${fld("currency","Currency")}${fld("price","Sale price","number")}${fld("oldPrice","Old price","number")}${fld("shipping","Delivery charges","number")}${fld("offerHours","Countdown (hours)","number")}${fld("maxQty","Max quantity","number")}</div>
    <label>Payment options (comma separated)<textarea data-k="payments" rows="2">${esc(C.payments)}</textarea></label>
    <h4>Where orders go</h4>
    ${fld("whatsapp","WhatsApp number (e.g. 923001234567)")}${fld("email","Email (empty = off)")}${fld("sheetUrl","Google Sheet web app URL (empty = off)")}
    <details><summary>Google Sheet setup code</summary>
      <ol class="note" style="padding-left:18px"><li>Create a Google Sheet, then open Extensions → Apps Script.</li><li>Delete everything and paste the code below, then Save.</li><li>Deploy → New deployment → type "Web app". Execute as: Me. Who has access: Anyone.</li><li>Authorize, copy the Web app URL and paste it in the field above.</li></ol>
      <button class="mini" data-a="copyjs">Copy code</button><pre>${esc(SHEET_SCRIPT)}</pre>
    </details>
    <h4>Sections</h4>
    ${chk("showTimer","Show countdown timer")}${chk("showFeatures","Show features")}${chk("showReviews","Show reviews")}
    ${fld("h2F","Features heading")}${fld("h2R","Reviews heading")}${fld("h2O","Order heading")}
    <h4>Form &amp; messages</h4>
    <div class="two">${fld("lName","Name label")}${fld("lPhone","Phone label")}${fld("lQty","Quantity label")}${fld("lCity","City label")}${fld("lAddr","Address label")}${fld("lPay","Payment label")}</div>
    ${fld("lSum","Summary heading")}
    <div class="two">${fld("lPrice","Price label")}${fld("lQtyS","Summary quantity")}${fld("lShip","Delivery label")}${fld("lTot","Total label")}${fld("lFree","Word for free")}${fld("tH","Hours")}${fld("tM","Minutes")}${fld("tS","Seconds")}</div>
    ${ta("sNote","Note under summary")}${fld("doneTitle","Thank-you title")}${ta("doneMsg","Thank-you message ({name} {phone} {orderId} {total})",2)}
    ${fld("msgFill","Empty form error")}${fld("msgSending","Sending message")}${ta("msgFail","Order not saved message",2)}
    <h4>WhatsApp message</h4>
    ${ta("waTemplate","Message template",12)}
    <p class="note">Placeholders: {orderId} {date} {product} {qty} {price} {shipping} {total} {payment} {name} {phone} {city} {address}. Use *text* for bold.</p>
    <b>Preview:</b><pre id="waPrev">${esc(previewWA())}</pre>
    <h4>Features</h4>
    ${C.features.map((f,i)=>`<div class="item"><div class="two"><input data-l="features" data-i="${i}" data-j="0" value="${esc(f[0])}" placeholder="Emoji"><input data-l="features" data-i="${i}" data-j="1" value="${esc(f[1])}" placeholder="Title"></div><input style="margin-top:8px" data-l="features" data-i="${i}" data-j="2" value="${esc(f[2])}" placeholder="Detail"><button class="mini" data-a="delf" data-i="${i}">Remove</button></div>`).join("")}
    <button class="mini" data-a="addf">+ Add feature</button>
    <h4>Reviews</h4>
    ${C.reviews.map((v,i)=>`<div class="item"><input data-l="reviews" data-i="${i}" data-j="0" value="${esc(v[0])}" placeholder="Name, city"><textarea style="margin-top:8px" rows="2" data-l="reviews" data-i="${i}" data-j="1">${esc(v[1])}</textarea><select style="margin-top:8px" data-l="reviews" data-i="${i}" data-j="2">${[5,4,3,2,1].map(n=>`<option ${v[2]==n?"selected":""}>${n}</option>`).join("")}</select><button class="mini" data-a="delr" data-i="${i}">Remove</button></div>`).join("")}
    <button class="mini" data-a="addr">+ Add review</button>
    <h4>Save / Publish</h4>
    <button class="btn sm" data-a="gh">Save to GitHub</button>
    <p class="note" id="ghmsg"></p>
    <details><summary>GitHub connection (one time)</summary>
      <label>Username<input data-g="owner" value="${esc(GH.owner)}"></label>
      <label>Repository name<input data-g="repo" value="${esc(GH.repo)}"></label>
      <label>Branch<input data-g="branch" value="${esc(GH.branch)}"></label>
      <label>Access token<input data-g="token" type="password" value="${esc(GH.token)}"></label>
      <p class="note">The token is stored only in this browser and is never written to config.json.</p>
    </details>
    <h4>Backup</h4>
    <button class="mini" data-a="dl">Download config.json</button>
    <label>Load a config.json<input type="file" accept=".json" data-a="import"></label>
    <button class="mini" data-a="reset">Reset draft</button>`;
  }
  build();
  function previewWA(){return fill(C.waTemplate,{orderId:"ORD-261120-4821",date:new Date().toLocaleString("en-PK",{dateStyle:"medium",timeStyle:"short"}),product:C.title,qty:2,price:rs(C.price),shipping:+C.shipping?rs(C.shipping):C.lFree,total:rs(C.price*2+ +C.shipping),payment:(C.payments.split(",")[0]||"").trim(),name:"Ali Raza",phone:"0300 1234567",city:"Lahore",address:"House 12, Street 5, Model Town"})}
  async function ghSave(){
    const m=$("ghmsg"),{owner,repo,branch,token}=GH,br=branch||"main";
    if(!owner||!repo||!token){m.textContent="Fill in the GitHub connection first (below).";return}
    m.textContent="Saving…";
    const url=`https://api.github.com/repos/${owner}/${repo}/contents/config.json`,H={Authorization:"Bearer "+token,Accept:"application/vnd.github+json"};
    try{
      let sha;const g=await fetch(url+"?ref="+br,{headers:H});
      if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(g.status);
      const body={message:"Update page settings",content:btoa(unescape(encodeURIComponent(JSON.stringify(C,null,2)))),branch:br};if(sha)body.sha=sha;
      const p=await fetch(url,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!p.ok)throw new Error(p.status);
      m.textContent="✅ Saved! Everyone will see the new settings in 1–2 minutes.";
    }catch(e){m.textContent="❌ Could not save (error "+e.message+"). Check the username, repository name and the token's Contents permission."}
  }
  function resize(file,max,type,cb){const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(type==="png"?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.82))};img.src=URL.createObjectURL(file)}
  P.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.k){const k=t.dataset.k;C[k]=t.type==="checkbox"?t.checked:(t.type==="number"||t.type==="range")?Number(t.value):t.value;if(t.type==="range"){const n=t.parentNode.firstChild;n.textContent=n.textContent.replace(/\d+px/,t.value+"px")}}
    else if(t.dataset.im!==undefined){C.images[+t.dataset.im]=t.value}
    else if(t.dataset.l){const x=t.value;C[t.dataset.l][t.dataset.i][t.dataset.j]=t.dataset.j==2&&t.dataset.l==="reviews"?+x:x}
    else if(t.dataset.g){GH[t.dataset.g]=t.value;try{localStorage.setItem("gh",JSON.stringify(GH))}catch(x){}return}
    else return;
    render();save();const pv=$("waPrev");if(pv)pv.textContent=previewWA();
  });
  P.addEventListener("change",e=>{
    const t=e.target,f=t.files&&t.files[0];if(!f)return;
    if(t.dataset.a==="upim"){const i=+t.dataset.i;resize(f,900,"jpg",d=>{C.images[i]=d;gi=C.images.slice(0,i+1).filter(Boolean).length-1;render();save();build()})}
    if(t.dataset.a==="logoup")resize(f,320,"png",d=>{C.logo=d;render();save();build()});
    if(t.dataset.a==="import")f.text().then(x=>{C=norm(JSON.parse(x));render();save();build()});
  });
  P.addEventListener("click",e=>{
    const a=e.target.dataset.a,i=+e.target.dataset.i;if(!a)return;
    if(a==="close")P.classList.remove("open");
    if(a==="gh"){ghSave();return}
    if(a==="copyjs"){navigator.clipboard&&navigator.clipboard.writeText(SHEET_SCRIPT);e.target.textContent="Copied ✓";return}
    if(a==="theme"){C.theme=e.target.dataset.v;C.accent=C.accent2=""}
    if(a==="resetcolors")C.accent=C.accent2="";
    if(a==="rmlogo")C.logo="";
    if(a==="rmim")C.images[i]="";
    if(a==="addf")C.features.push(["✨","New feature","Describe it here"]);
    if(a==="delf")C.features.splice(i,1);
    if(a==="addr")C.reviews.push(["Name, City","Write the review here",5]);
    if(a==="delr")C.reviews.splice(i,1);
    if(a==="reset"){try{localStorage.removeItem("draftCfg")}catch(x){}location.reload();return}
    if(a==="dl"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,2)],{type:"application/json"}));l.download="config.json";l.click();return}
    if(["theme","resetcolors","rmlogo","rmim","addf","delf","addr","delr"].includes(a)){render();save();const sc=P.scrollTop;build();P.scrollTop=sc}
  });
}

/* ===== START: defaults → config.json → (admin draft) ===== */
(async()=>{
  try{const r=await fetch("config.json?v="+Date.now(),{cache:"no-store"});if(r.ok)C=norm(await r.json())}catch(e){}
  if(ADMIN){try{const d=localStorage.getItem("draftCfg");if(d)C=norm(JSON.parse(d))}catch(e){}}
  render();
  if(ADMIN)setupAdmin();
})();
